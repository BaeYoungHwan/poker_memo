name: CI / CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  # ── 1. Flutter 정적 분석 + 단위 테스트 ──────────────────────────────
  flutter-check:
    name: Flutter 분석 및 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 단위 테스트
        run: flutter test

  # ── 2. Cloud Functions TypeScript 빌드 ──────────────────────────────
  functions-build:
    name: Cloud Functions TypeScript 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: TypeScript 빌드
        run: npm run build

  # ── 3. Firebase 배포 (master push + CI 통과 시에만) ─────────────────
  # 사전 준비: GitHub Settings > Secrets > GCP_SA_KEY 에
  # Firebase Admin SDK 서비스 계정 JSON(전체 내용)을 등록해야 합니다.
  deploy-firebase:
    name: Firebase 배포
    runs-on: ubuntu-latest
    needs: [flutter-check, functions-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Functions 의존성 설치
        working-directory: functions
        run: npm ci

      - name: Firebase 배포 (Functions + Firestore 규칙)
        run: npx firebase-tools@latest deploy --only functions,firestore --project poker-memo-ai --non-interactive
